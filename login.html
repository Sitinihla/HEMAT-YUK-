<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEMAT YUK! - Masuk</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #010736;
        color: #fcf1d0;
        padding: 16px;
      }

      .card {
        width: min(490px, 100%);
        padding: 32px 36px;
        border: 1px solid #22396f;
        border-radius: 20px;
        background: #0d1c42;
      }

      .brand-container {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }

      .brand-icon {
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #22396f;
        border-radius: 10px;
        background: #22396f;
        color: #fcf1d0;
        font-size: 20px;
      }

      .brand-text h1 {
        margin: 0;
        color: #fcf1d0;
        font-size: 20px;
        font-weight: 800;
        line-height: 1.1;
      }

      .brand-text p {
        margin: 4px 0 0;
        color: #fcf1d0;
        font-size: 12px;
        opacity: 0.8;
      }

      .form-title {
        margin: 0 0 6px;
        font-size: 22px;
      }

      .form-subtitle {
        margin: 0 0 22px;
        color: #bbc6df;
      }

      label {
        display: block;
        margin: 14px 0 7px;
        font-size: 13px;
        font-weight: 700;
      }

      input {
        width: 100%;
        border: 1px solid #22396f;
        border-radius: 8px;
        padding: 12px;
        background: #010736;
        color: #fff;
      }

      button {
        width: 100%;
        margin-top: 18px;
        border: 0;
        border-radius: 8px;
        padding: 12px;
        background: #fcf1d0;
        color: #010736;
        font-weight: 800;
        cursor: pointer;
      }

      .switch {
        width: auto;
        margin: 14px 0 0;
        background: transparent;
        color: #fcf1d0;
        font-size: 13px;
      }

      .error {
        min-height: 18px;
        margin-top: 12px;
        color: #ff9b9b;
        font-size: 13px;
      }

      @media (max-width: 480px) {
        .card {
          padding: 28px 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <header class="brand-container">
        <div class="brand-icon" aria-hidden="true">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <div class="brand-text">
          <h1>HEMAT YUK!</h1>
          <p>Pencatat Keuangan Harian</p>
        </div>
      </header>
      <h2 class="form-title" id="title">Masuk</h2>
      <p class="form-subtitle" id="subtitle">Kelola keuangan dengan aman.</p>
      <form id="authForm">
        <label for="username">USERNAME</label>
        <input id="username" autocomplete="username" required />
        <div id="emailGroup" hidden>
          <label for="email">EMAIL</label>
          <input id="email" type="email" autocomplete="email" />
        </div>
        <label for="password">PASSWORD</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button type="submit" id="submitBtn">Masuk</button>
        <button type="button" class="switch" id="switchBtn">Belum punya akun? Daftar</button>
        <div class="error" id="error"></div>
      </form>
    </div>
    <script>
      let registerMode = false;
      const form = document.getElementById("authForm");
      const error = document.getElementById("error");

      document.getElementById("switchBtn").addEventListener("click", () => {
        registerMode = !registerMode;
        document.getElementById("emailGroup").hidden = !registerMode;
        document.getElementById("title").textContent =
          registerMode ? "Daftar Akun" : "Masuk";
        document.getElementById("submitBtn").textContent =
          registerMode ? "Daftar" : "Masuk";
        document.getElementById("switchBtn").textContent =
          registerMode ? "Sudah punya akun? Masuk" : "Belum punya akun? Daftar";
        error.textContent = "";
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";
        const payload = {
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
        };
        if (registerMode) payload.email = document.getElementById("email").value.trim();

        try {
          const response = await fetch(registerMode ? "/api/auth/register" : "/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.message || "Permintaan gagal");

          if (registerMode) {
            registerMode = false;
            document.getElementById("emailGroup").hidden = true;
            document.getElementById("title").textContent = "Masuk";
            document.getElementById("submitBtn").textContent = "Masuk";
            document.getElementById("switchBtn").textContent = "Belum punya akun? Daftar";
            error.style.color = "#a7e8ba";
            error.textContent = data.message;
          } else {
            localStorage.setItem("token", data.token);
            localStorage.setItem("currentUser", JSON.stringify(data.user));
            window.location.href = "/dashboard";
          }
        } catch (err) {
          error.style.color = "#ff9b9b";
          error.textContent = err.message;
        }
      });
    </script>
  </body>
</html>
